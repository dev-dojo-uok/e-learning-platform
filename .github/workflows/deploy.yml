name: E-Learning-SAC system deployment | AWS

on:
  push:
    branches:
      - main

jobs:

  # JOB 1: FRONTEND DEPLOYMENT (S3 + CLOUDFRONT)
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          REACT_APP_API_URL: ${{ secrets.BACKEND_API_URL }} 

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy Static Files to Amazon S3
        run: |
          aws s3 sync ./frontend/build s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"


  # JOB 2: BACKEND DEPLOYMENT (EC2 + PM2)
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Execute Remote SSH Commands on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Pull the code from the root git folder
            cd /var/www
            git pull origin main
            
            # 2. Move into the backend folder to run system commands
            cd /var/www/backend
            npm install --production
            npx prisma generate
            npx prisma db push
            
            # 3. Restart your application process
            pm2 restart express-lms-backend || pm2 start src/app.js --name "express-lms-backend"